<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.45);
            --accent-glow: rgba(255, 255, 255, 0.03);
            --transition-ios: all 0.5s cubic-bezier(0.28, 0.96, 0.24, 0.99);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        /* Dynamic Liquid Background Elements */
        .liquid-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
            transition: var(--transition-ios);
        }

        .liquid-orb-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(120, 150, 255, 0.04) 0%, rgba(0,0,0,0) 70%);
            top: 40%;
            left: 55%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
            transition: var(--transition-ios);
        }

        /* iOS Glass Card */
        .container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 42px 36px;
            border-radius: 36px;
            text-align: center;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 0 var(--glass-highlight);
            width: 340px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        /* iOS Segmented Control Style Tabs */
        .mode-container {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 32px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .mode-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 0;
            font-size: 0.82rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-ios);
            font-family: inherit;
            flex: 1;
            letter-spacing: -0.2px;
        }

        .mode-tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 0 rgba(255,255,255,0.1);
            font-weight: 600;
        }

        /* Typography & Timer Display */
        .timer-display {
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: -3px;
            margin: 6px 0 32px 0;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            text-shadow: 0 0 30px rgba(255,255,255,0.08);
        }

        /* iOS Style Buttons */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 16px 24px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition-ios);
            font-family: inherit;
            flex: 1;
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.92);
            color: #000000;
            border-color: transparent;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(255,255,255,0.15), inset 0 1px 1px 0 rgba(255,255,255,0.5);
        }

        .btn-primary:hover {
            background: #ffffff;
            opacity: 1;
        }

        .status-text {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--text-secondary);
            margin-top: 26px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="liquid-orb" id="orb"></div>
    <div class="liquid-orb-2" id="orb-2"></div>

    <div class="container">
        <div class="mode-container">
            <button class="mode-tab active" id="tab-work">Focus</button>
            <button class="mode-tab" id="tab-break">Break</button>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        
        <div class="controls">
            <button class="btn btn-primary" id="start-btn">Start</button>
            <button class="btn" id="reset-btn">Reset</button>
        </div>

        <div class="status-text" id="status">Ready</div>
    </div>

    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;

        let currentTime = WORK_TIME;
        let timerId = null;
        let isRunning = false;
        let isWorkSession = true;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusText = document.getElementById('status');
        const tabWork = document.getElementById('tab-work');
        const tabBreak = document.getElementById('tab-break');
        const alarmSound = document.getElementById('alarm-sound');
        const orbElement = document.getElementById('orb');
        const orbTwoElement = document.getElementById('orb-2');

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(currentTime);
            document.title = `${formatTime(currentTime)} — Pomodoro`;
        }

        function switchMode(workMode) {
            if (isRunning) pauseTimer();
            isWorkSession = workMode;
            currentTime = isWorkSession ? WORK_TIME : BREAK_TIME;
            
            if (isWorkSession) {
                tabWork.classList.add('active');
                tabBreak.classList.remove('active');
                statusText.textContent = "Ready";
                orbElement.style.background = "radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 70%)";
                orbTwoElement.style.background = "radial-gradient(circle, rgba(120, 150, 255, 0.04) 0%, rgba(0,0,0,0) 70%)";
            } else {
                tabBreak.classList.add('active');
                tabWork.classList.remove('active');
                statusText.textContent = "Rest";
                // Shift to a subtle liquid green-cyan tint for break glass effect
                orbElement.style.background = "radial-gradient(circle, rgba(52, 211, 153, 0.06) 0%, rgba(0,0,0,0) 70%)";
                orbTwoElement.style.background = "radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, rgba(0,0,0,0) 70%)";
            }
            updateDisplay();
        }

        function startTimer() {
            if (isRunning) return;

            isRunning = true;
            startBtn.textContent = "Pause";
            statusText.textContent = isWorkSession ? "Focusing" : "Resting";

            timerId = setInterval(() => {
                if (currentTime > 0) {
                    currentTime--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    isRunning = false;
                    
                    alarmSound.play().catch(error => console.log("Audio play blocked:", error));

                    switchMode(!isWorkSession);
                    startTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
            isRunning = false;
            startBtn.textContent = "Start";
            statusText.textContent = "Paused";
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            pauseTimer();
            currentTime = isWorkSession ? WORK_TIME : BREAK_TIME;
            startBtn.textContent = "Start";
            statusText.textContent = "Ready";
            updateDisplay();
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        tabWork.addEventListener('click', () => switchMode(true));
        tabBreak.addEventListener('click', () => switchMode(false));

        updateDisplay();
    </script>
</body>
</html>
